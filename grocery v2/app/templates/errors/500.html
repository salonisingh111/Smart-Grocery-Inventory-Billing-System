{% extends "base.html" %}
{% block title %}Server Error (500){% endblock %}

{% block content %}
<div style="text-align: center; padding: 80px 20px;">
  <div class="metric-icon icon-red" style="width: 80px; height: 80px; font-size: 2.5rem; margin: 0 auto 24px;">
    <i class="fas fa-triangle-exclamation"></i>
  </div>
  <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 12px;">500 - Internal Server Error</h1>
  <p style="color: var(--text-muted); max-width: 480px; margin: 0 auto 24px;">An unexpected error occurred while processing your request. Please try again or contact system support.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary"><i class="fas fa-house"></i> Return to Dashboard</a>
</div>
{% endblock %}
