{% extends "base.html" %}
{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div style="text-align: center; padding: 80px 20px;">
  <div class="metric-icon icon-blue" style="width: 80px; height: 80px; font-size: 2.5rem; margin: 0 auto 24px;">
    <i class="fas fa-compass-slash"></i>
  </div>
  <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 12px;">404 - Page Not Found</h1>
  <p style="color: var(--text-muted); max-width: 480px; margin: 0 auto 24px;">The requested resource or page does not exist or has been moved.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary"><i class="fas fa-house"></i> Return to Dashboard</a>
</div>
{% endblock %}
